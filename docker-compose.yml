services:
  web:
    container_name: aegis-keepass
    build: .
    ports:
      - "127.0.0.1:8580:8580"
    environment:
      - SESSION_TIMEOUT_SECONDS=1800
      - MAX_IN_MEMORY_UPLOAD_BYTES=33554432
      - MAX_UPLOAD_BYTES=52428800
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
