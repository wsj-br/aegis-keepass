# Build desktop executables and attach them to the GitHub Release.
#
# Native runners only (no QEMU):
#   Linux AMD64, Linux ARM64, macOS Intel, macOS ARM64, Windows x64, Windows ARM64.
# Linux jobs wrap the PyInstaller binary with scripts/package-linux-appimage.sh
# (aegis-keepass-<version>-linux-amd64.AppImage / linux-arm64.AppImage).
# Windows jobs wrap it with scripts/package-windows-installer.ps1
# (aegis-keepass-<version>-windows-x64.exe / windows-arm64.exe).
# macOS jobs call scripts/build-desktop.sh, which also writes a DMG.

name: Desktop Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (e.g. v0.1.6). Required for manual runs."
        required: true
        type: string

env:
  PYTHON_VERSION: "3.13"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app_version.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get app version
        id: app_version
        run: |
          chmod +x scripts/version
          VERSION=$(./scripts/version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

  build-desktop:
    name: Desktop (${{ matrix.asset_suffix }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset_suffix: windows-x64
          - runner: windows-11-arm
            asset_suffix: windows-arm64
          - runner: ubuntu-latest
            asset_suffix: linux-amd64
          - runner: ubuntu-24.04-arm
            asset_suffix: linux-arm64
          - runner: macos-15-intel
            asset_suffix: macos-intel
          - runner: macos-15
            asset_suffix: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-webkit2-4.1 \
            gir1.2-gtk-3.0 \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            libgirepository1.0-dev \
            libcairo2-dev \
            gobject-introspection

      - name: Install Python dependencies
        if: runner.os != 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt
          # setup-python does not see Debian python3-gi, and its ABI often
          # differs from the distro package. <3.52 stays on girepository-1.0,
          # which matches libgirepository1.0-dev installed above.
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install 'PyGObject>=3.48,<3.52'
          fi

      - name: Build with PyInstaller
        if: runner.os != 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean packaging/aegis-keepass.spec

      - name: Build macOS app and DMG
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/version scripts/build-desktop.sh
          ./scripts/build-desktop.sh

      - name: Package artifact (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows-installer.ps1
          $ver = "${{ needs.prepare.outputs.version }}"
          # asset_suffix is already "windows-x64" or "windows-arm64".
          $asset = "dist/aegis-keepass-$ver-${{ matrix.asset_suffix }}.exe"
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
            throw "Missing installer: $asset"
          }
          echo "ASSET_PATH=$asset" >> $env:GITHUB_ENV
          echo "Uploading $asset"

      - name: Package artifact (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/version scripts/package-linux-appimage.sh
          ./scripts/package-linux-appimage.sh
          VER="${{ needs.prepare.outputs.version }}"
          # asset_suffix is already "linux-amd64" or "linux-arm64".
          ASSET="dist/aegis-keepass-${VER}-${{ matrix.asset_suffix }}.AppImage"
          test -f "$ASSET"
          test -x "$ASSET"
          echo "ASSET_PATH=${ASSET}" >> "$GITHUB_ENV"
          echo "Uploading ${ASSET}"

      - name: Locate macOS artifacts
        if: runner.os == 'macOS'
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          NAME="aegis-keepass-${VER}-${{ matrix.asset_suffix }}"
          test -f "dist/${NAME}.dmg"
          test -f "dist/${NAME}.dmg.sha256"
          echo "ASSET_PATH=dist/${NAME}.dmg" >> "$GITHUB_ENV"
          echo "ASSET_SHA=dist/${NAME}.dmg.sha256" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        if: runner.os != 'macOS'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: ${{ env.ASSET_PATH }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.ASSET_SHA }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
