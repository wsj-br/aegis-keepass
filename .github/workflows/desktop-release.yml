# Build desktop executables (Windows x64, Linux x64/arm64, macOS universal2)
# and attach them to the GitHub Release. Triggered alongside docker-release.yml.
#
# Uses native runners (no QEMU): amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm.

name: Desktop Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (e.g. v0.1.5). Required for manual runs."
        required: true
        type: string

env:
  PYTHON_VERSION: "3.13"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app_version.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get app version
        id: app_version
        run: |
          VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' app/_version.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

  build-desktop:
    name: Desktop (${{ matrix.asset_suffix }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset_suffix: windows-x64
          - runner: ubuntu-latest
            asset_suffix: linux-x64
          - runner: ubuntu-24.04-arm
            asset_suffix: linux-arm64
          - runner: macos-14
            asset_suffix: macos-universal2
            python_arch: universal2
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python (default arch)
        if: ${{ !matrix.python_arch }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Python (universal2)
        if: ${{ matrix.python_arch }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}

      - name: Install Linux WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-webkit2-4.1 \
            gir1.2-gtk-3.0 \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            libgirepository1.0-dev \
            libcairo2-dev \
            gobject-introspection

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean packaging/aegis-keepass.spec

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare.outputs.version }}"
          $name = "aegis-keepass-$ver-${{ matrix.asset_suffix }}"
          New-Item -ItemType Directory -Force -Path "artifact/$name" | Out-Null
          Copy-Item dist/aegis-keepass.exe "artifact/$name/"
          Copy-Item LICENSE,NOTICES "artifact/$name/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "artifact/$name/*" -DestinationPath "artifact/$name.zip"
          echo "ASSET_PATH=artifact/$name.zip" >> $env:GITHUB_ENV
          echo "ASSET_NAME=$name.zip" >> $env:GITHUB_ENV

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          NAME="aegis-keepass-${VER}-${{ matrix.asset_suffix }}"
          mkdir -p "artifact/${NAME}"
          cp dist/aegis-keepass "artifact/${NAME}/"
          cp LICENSE NOTICES "artifact/${NAME}/" 2>/dev/null || true
          chmod +x "artifact/${NAME}/aegis-keepass"
          tar -C artifact -czf "artifact/${NAME}.tar.gz" "${NAME}"
          echo "ASSET_PATH=artifact/${NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_NAME=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          NAME="aegis-keepass-${VER}-${{ matrix.asset_suffix }}"
          mkdir -p "artifact/${NAME}"
          if [ -d "dist/Aegis-KeePass OTP Sync.app" ]; then
            cp -R "dist/Aegis-KeePass OTP Sync.app" "artifact/${NAME}/"
          else
            cp dist/aegis-keepass "artifact/${NAME}/"
            chmod +x "artifact/${NAME}/aegis-keepass"
          fi
          cp LICENSE NOTICES "artifact/${NAME}/" 2>/dev/null || true
          (
            cd artifact
            zip -r "${NAME}.zip" "${NAME}"
          )
          echo "ASSET_PATH=artifact/${NAME}.zip" >> "$GITHUB_ENV"
          echo "ASSET_NAME=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: ${{ env.ASSET_PATH }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
